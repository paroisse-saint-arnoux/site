# ---------------------------------------------------------------------------
# Calendrier pastoral 2026-2027 (repris du livret paroissial)
#
# Chaque rubrique contient :
#   id       identifiant court, sans espace ni accent (sert aux liens #id)
#   titre    titre affiché
#   intro    (facultatif) texte d'introduction
#   accueil  (facultatif) true = les dates apparaissent dans
#            « Prochains rendez-vous » sur la page d'accueil
#   dates    la liste des dates de la rubrique
#
# Chaque date contient :
#   date     jour au format AAAA-MM-JJ, par ex. 2026-12-24
#   fin      (facultatif) dernier jour, pour un événement sur plusieurs jours
#   titre    ce qui se passe
#   heure    (facultatif) par ex. 10h30
#   lieu     (facultatif) par ex. Le Rouret
#   messe    (facultatif) true = l'événement apparaît aussi dans
#            « Messes et célébrations particulières » (page Horaires)
#
# Attention à l'indentation (2 espaces, jamais de tabulation). Si un titre
# contient le caractère « : », mettez-le entre guillemets.
# Les dates passées sont grisées ou masquées automatiquement sur le site.
# ---------------------------------------------------------------------------

